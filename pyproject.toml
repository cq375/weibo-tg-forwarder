[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-tg-forwarder"
version = "0.1.0"
description = "监控微博并将新内容及媒体转发到 Telegram 频道"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.61.0",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
weibo-tg = "weibo_tg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
