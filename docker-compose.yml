name: weibo-tg-forwarder

services:
  weibo-tg:
    build: .
    restart: unless-stopped
    shm_size: "512mb"
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    command: ["weibo-tg", "--config", "/app/config.yml", "run"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
