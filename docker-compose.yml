name: weibo-tg-forwarder

services:
  weibo-tg:
    build: .
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE=/opt/chrome-for-testing/chrome-linux64/chrome
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    command: ["weibo-tg", "--config", "/app/config.yml", "run"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  douyin-tg:
    build: .
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE=/opt/chrome-for-testing/chrome-linux64/chrome
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    command: ["douyin-tg", "--config", "/app/config.yml", "run"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
